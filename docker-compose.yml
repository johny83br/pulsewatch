name: pulsewatch
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: pulsewatch-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/laravel-api:/var/www/html:ro
    depends_on:
      laravel-api:
        condition: service_started
      frontend:
        condition: service_started
    networks: [pulsewatch]

  frontend:
    image: node:22-alpine
    container_name: pulsewatch-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./frontend/web:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    networks: [pulsewatch]

  laravel-api:
    build:
      context: ./backend/laravel-api
      dockerfile: Dockerfile
    image: pulsewatch-laravel:dev
    container_name: pulsewatch-laravel-api
    working_dir: /var/www/html
    volumes:
      - ./backend/laravel-api:/var/www/html
      - laravel_vendor:/var/www/html/vendor
    environment: &laravel_environment
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-pulsewatch}
      DB_USERNAME: ${POSTGRES_USER:-pulsewatch}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pulsewatch_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-pulsewatch}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-pulsewatch_dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [pulsewatch]

  laravel-scheduler:
    image: pulsewatch-laravel:dev
    container_name: pulsewatch-laravel-scheduler
    command:
      [
        "sh",
        "-c",
        "until [ -f vendor/autoload.php ]; do sleep 2; done; exec php artisan schedule:work",
      ]
    working_dir: /var/www/html
    volumes:
      - ./backend/laravel-api:/var/www/html
      - laravel_vendor:/var/www/html/vendor
    environment:
      <<: *laravel_environment
      SKIP_COMPOSER_INSTALL: "1"
    depends_on:
      laravel-api:
        condition: service_started
    restart: unless-stopped
    networks: [pulsewatch]

  laravel-queue:
    image: pulsewatch-laravel:dev
    container_name: pulsewatch-laravel-queue
    command:
      [
        "sh",
        "-c",
        "until [ -f vendor/autoload.php ]; do sleep 2; done; exec php artisan queue:work --sleep=3 --tries=3 --timeout=90",
      ]
    working_dir: /var/www/html
    volumes:
      - ./backend/laravel-api:/var/www/html
      - laravel_vendor:/var/www/html/vendor
    environment:
      <<: *laravel_environment
      SKIP_COMPOSER_INSTALL: "1"
    depends_on:
      laravel-api:
        condition: service_started
    restart: unless-stopped
    networks: [pulsewatch]

  monitoring-worker:
    build:
      context: ./monitoring-engine
      dockerfile: Dockerfile
    image: pulsewatch-monitoring:dev
    container_name: pulsewatch-monitoring-worker
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${MONITORING_LOG_LEVEL:-INFO}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-pulsewatch}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-pulsewatch_dev}
      RABBITMQ_REQUEST_QUEUE: ${RABBITMQ_REQUEST_QUEUE:-monitor.check.requested}
      RABBITMQ_RESULT_EXCHANGE: ${RABBITMQ_RESULT_EXCHANGE:-pulsewatch.events}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-20}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-50}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks: [pulsewatch]

  monitoring-api:
    image: pulsewatch-monitoring:dev
    container_name: pulsewatch-monitoring-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${MONITORING_API_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${MONITORING_LOG_LEVEL:-INFO}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-pulsewatch}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-pulsewatch_dev}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks: [pulsewatch]

  postgres:
    image: postgres:17-alpine
    container_name: pulsewatch-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulsewatch}
      POSTGRES_USER: ${POSTGRES_USER:-pulsewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsewatch_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [pulsewatch]

  redis:
    image: redis:7-alpine
    container_name: pulsewatch-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [pulsewatch]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: pulsewatch-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-pulsewatch}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-pulsewatch_dev}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [pulsewatch]

networks:
  pulsewatch:
    name: pulsewatch-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  frontend_node_modules:
  laravel_vendor:
